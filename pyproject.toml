[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-accelerator-validation-suite"
version = "0.1.0"
description = "CPU-first synthetic ONNX inference performance and reliability validation"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "onnx>=1.16,<2", "onnxruntime>=1.20,<2", "onnxscript>=0.3,<1", "psutil>=6,<8", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "jsonschema>=4,<5"]

[project.scripts]
aivs = "aivs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real local CPU execution"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
