name: CPU validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU runtime and package
        run: |
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: aivs --help
      - run: aivs doctor
      - run: aivs demo --out artifacts/demo
      - run: aivs bench --config config/benchmark.cpu.yaml --out artifacts/cpu_run
      - run: python scripts/validate_artifacts.py artifacts/demo artifacts/cpu_run
